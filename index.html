<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>류마 운세 - Ryuma Fortune</title>
<meta name="description" content="오늘의 운세, 타로, 심리테스트를 가볍게 즐기는 하루 한 번 운세 앱." />
<meta name="theme-color" content="#faf6f0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
<!-- Vue 3 (CDN, ESM build) -->
<script type="importmap">
{ "imports": { "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js" } }
</script>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="app-header">
    <div class="brand">
      <span class="brand-emoji">🔮</span>
      <div>
        <div>류마 운세</div>
        <div class="brand-sub">오늘의 운세 · 심리테스트</div>
      </div>
    </div>
    <div class="header-meta">
      <div class="header-date">{{ todayLabel }}</div>
      <div class="header-weather" v-if="!weatherLoading && !weatherError">
        {{ weatherEmoji }} {{ weatherTemp }}°C
      </div>
    </div>
  </div>

  <!-- 오늘의 한마디 -->
  <div class="daily-quote">💡 {{ dailyQuote }}</div>

  <!-- ===================== 콘텐츠 실행 화면 ===================== -->
  <div class="view-wrap" v-if="activeContent">
    <button class="back-btn" @click="closeContent">‹ 목록으로</button>
    <component
      :is="runnerFor(activeContent)"
      :key="activeContent.id"
      :content="activeContent"
      :date-label="todayLabel"
    />
  </div>

  <template v-else>
    <!-- ===================== 오늘 (홈) ===================== -->
    <div class="view-wrap" v-if="activeTab === 'home'">
      <div class="section-title">✨ 오늘의 픽</div>
      <div class="section-desc">날마다 다른 콘텐츠가 올라와요.</div>

      <div class="feature-card" @click="openContent(featured)">
        <div class="feature-glow"></div>
        <span class="feature-badge">{{ formatLabel(featured.format) }}</span>
        <div class="feature-emoji">{{ featured.emoji }}</div>
        <h2>{{ featured.title }}</h2>
        <p>{{ featured.tagline }}</p>
        <span class="feature-cta">지금 해보기 ›</span>
      </div>

      <div class="section-title sm">⚡ 입력 없이 바로</div>
      <div class="tile-grid">
        <button class="tile" v-for="c in draws" :key="c.id" @click="openContent(c)">
          <span class="tile-emoji">{{ c.emoji }}</span>
          <span class="tile-title">{{ c.title }}</span>
        </button>
      </div>

      <div class="section-title sm">🧠 가볍게 해보기</div>
      <button class="row-item" v-for="c in quizzes.slice(0, 3)" :key="c.id" @click="openContent(c)">
        <span class="row-emoji">{{ c.emoji }}</span>
        <span class="row-txt">
          <b>{{ c.title }}</b>
          <span>{{ c.tagline }}</span>
        </span>
        <span class="row-arrow">›</span>
      </button>
    </div>

    <!-- ===================== 운세 (포맷 C) ===================== -->
    <div class="view-wrap" v-if="activeTab === 'fortune'">
      <div class="section-title">🔮 운세</div>
      <div class="section-desc">생년월일이나 이름으로 오늘의 흐름을 확인해보세요.</div>

      <button class="row-item" v-for="c in profiles" :key="c.id" @click="openContent(c)">
        <span class="row-emoji">{{ c.emoji }}</span>
        <span class="row-txt">
          <b>{{ c.title }}</b>
          <span>{{ c.tagline }}</span>
        </span>
        <span class="row-arrow">›</span>
      </button>
    </div>

    <!-- ===================== 테스트 (포맷 B) ===================== -->
    <div class="view-wrap" v-if="activeTab === 'test'">
      <div class="section-title">🧠 심리테스트</div>
      <div class="section-desc">질문 두세 개면 결과가 나와요.</div>

      <button class="row-item" v-for="c in quizzes" :key="c.id" @click="openContent(c)">
        <span class="row-emoji">{{ c.emoji }}</span>
        <span class="row-txt">
          <b>{{ c.title }}</b>
          <span>{{ c.tagline }}</span>
        </span>
        <span class="row-arrow">›</span>
      </button>
    </div>

    <!-- ===================== 류마 안내 ===================== -->
    <div class="view-wrap" v-if="activeTab === 'info'">
      <div class="section-title">📍 류마 안내</div>
      <div class="section-desc">매장 위치와 영업 정보를 확인하실 수 있어요.</div>

      <div class="card map-card">
        <div class="map-embed">
          <!-- 지도가 로드되지 않는 환경에서도 위치가 보이도록 뒤에 폴백을 둔다 -->
          <div class="map-fallback"><span>📍</span>{{ shop.name }}</div>
          <iframe
            :src="mapEmbedSrc"
            title="류마 매장 위치 지도"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen
          ></iframe>
        </div>
        <div class="map-info">
          <div class="shop-name">{{ shop.name }}</div>
          <div class="shop-addr">{{ shop.addr }}</div>
          <div class="map-btn-row">
            <a class="map-btn" :href="shop.naverMap" target="_blank" rel="noopener noreferrer">🗺️ 지도에서 보기</a>
            <a class="map-btn" :href="shop.naverSearch" target="_blank" rel="noopener noreferrer">📅 예약 · 정보</a>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🍽️ 대표 메뉴</div>
        <div class="menu-chip-grid">
          <div class="menu-chip" v-for="m in menuItems" :key="m.name">
            <span>{{ m.icon }}</span>
            <span>{{ m.name }}</span>
            <span class="price">{{ m.price }}</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🕒 영업시간</div>
        <div class="hours-list">
          <div><span class="day">평일</span> 11:30 - 21:30</div>
          <div><span class="day">주말</span> 11:00 - 22:00</div>
          <div><span class="day">매주 월요일</span> 정기휴무</div>
        </div>
      </div>

      <div class="footer-log">Ryuma Fortune v1.1.0</div>
    </div>
  </template>

  <!-- Toast -->
  <div class="toast" v-if="toastMsg">{{ toastMsg }}</div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button
      v-for="tab in tabs"
      :key="tab.key"
      class="nav-item"
      :class="{active: activeTab === tab.key && !activeContent}"
      @click="goTab(tab.key)"
    >
      <span class="nav-ico">{{ tab.icon }}</span>
      <span>{{ tab.label }}</span>
    </button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
